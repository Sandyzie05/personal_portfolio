<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sandeep Gupta builds reliable software platforms, SRE systems, developer tooling, and practical AI products."
    />
    <meta name="theme-color" content="#07111F" />
    <meta property="og:title" content="Sandeep Gupta | Software Engineer, SRE & AI Builder" />
    <meta property="og:description" content="Reliable software, operable platforms, and practical AI." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      ;(() => {
        const saved = localStorage.getItem('portfolio-theme')
        const theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <title>Sandeep Gupta | Software Engineer, SRE & AI Builder</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
